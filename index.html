<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Fitting Room</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="ui">
  <h2>AERO Collection</h2>

  <!-- اختيار التيشيرت -->
  <div>
    <h3>T-Shirts</h3>
    <button onclick="changeShirt('public/textures/shirt1.png')">Shirt 1</button>
    <button onclick="changeShirt('public/textures/shirt2.png')">Shirt 2</button>
  </div>

  <!-- اختيار البنطلون -->
  <div>
    <h3>Pants</h3>
    <button onclick="changePant('public/pants/pant1.png')">Pant 1</button>
  </div>

  <!-- المقاسات -->
  <div>
    <h3>Size</h3>
    <select id="fitType">
      <option value="regular">Regular</option>
      <option value="oversize">Oversize</option>
    </select>

    <select id="size">
      <option>S</option>
      <option>M</option>
      <option>L</option>
    </select>

    <p id="sizeGuide"></p>
  </div>
</div>

<canvas id="canvas"></canvas>

<script type="module" src="main.js"></script>
</body>
</html>
