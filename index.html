<div class="details-section">
    <h2 id="productName">The Maverick Phoenix</h2>
    <p class="price">EGP 500</p>

    <div class="input-group">
        <label for="genderSelect">Gender (المجسم):</label>
        <select id="genderSelect" onchange="changeGender()">
            <option value="public/model/joe__realistic_human_3d_model.glb">Male</option>
            <option value="public/model/FemaleBodyWithShirt.glb">Female</option>
        </select>
    </div>

    <div class="measurements-grid">
        <div class="input-group">
            <label for="userHeight">Height (cm):</label>
            <input type="number" id="userHeight" value="175" oninput="adjustBodySize()">
        </div>
        <div class="input-group">
            <label for="userWeight">Weight (kg):</label>
            <input type="number" id="userWeight" value="70" oninput="adjustBodySize()">
        </div>
    </div>

    <div class="input-group">
        <label for="itemSelect">Select Product:</label>
        <select id="itemSelect" onchange="handleItemChange()">
            
            <optgroup label="Over Size T-Shirts">
                <option value="public/textures/maverick-dark-black.jpg" data-fit="oversize" data-type="tshirt">The Maverick Phoenix (Dark Black)</option>
                <option value="public/textures/maverick-white-base.jpg" data-fit="oversize" data-type="tshirt">The Maverick Phoenix (White Base)</option>
                <option value="public/textures/catalyst-tee.jpg" data-fit="oversize" data-type="tshirt">The Catalyst Tee</option>
                <option value="public/textures/yellowish-splash.jpg" data-fit="oversize" data-type="tshirt">Yellowish Splash</option>
                <option value="public/textures/greenish-splash.jpg" data-fit="oversize" data-type="tshirt">Greenish Splash</option>
            </optgroup>

            <optgroup label="Regular Size Fits">
                <option value="public/textures/powder-blue.jpg" data-fit="regular" data-type="tshirt">The Powder Blue Venture Tee</option>
                <option value="public/textures/bluish-splash.jpg" data-fit="regular" data-type="tshirt">Bluish Splash</option>
                <option value="public/textures/cyber-crescent.jpg" data-fit="regular" data-type="tshirt">CYBER CRESCENT</option>
            </optgroup>

            <optgroup label="Sweatpants">
                <option value="public/textures/black-flux.jpg" data-fit="regular" data-type="pants">Black Flux Sweatpants</option>
                <option value="public/textures/light-code.jpg" data-fit="regular" data-type="pants">Light Code Sweatpants</option>
            </optgroup>

        </select>
    </div>
    
    <div class="input-group">
        <label>Fit Type:</label>
        <input type="text" id="fitDisplay" value="Over Size" readonly style="background-color: #222; color: #00e5ff; font-weight: bold;">
        <input type="hidden" id="fitValue" value="oversize">
    </div>

    <div class="input-group">
        <label for="size">Select Size:</label>
        <select id="size">
            </select>
    </div>

    <button class="btn-guide" onclick="openGuideModal()">View Size Guide</button>
    <button class="btn-buy">ADD TO CART</button>
</div>
